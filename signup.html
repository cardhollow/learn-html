<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0f1115">
<title>Sign Up</title>

<style>
:root{
  --bg:#0f1115;
  --panel:#171a21;
  --panel-2:#1d2230;
  --text:#e8eaf0;
  --muted:#a9b0c0;
  --accent:#6ea8fe;
  --border:rgba(255,255,255,.1);
  --radius:16px;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

.auth{
  width:100%;
  max-width:400px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:28px;
  box-shadow:0 15px 40px rgba(0,0,0,.3);
}

h1{
  margin:0;
  font-size:1.8rem;
  text-align:center;
}

.subtitle{
  margin:7px 0 24px;
  color:var(--muted);
  text-align:center;
  font-size:.92rem;
}

.form-group{
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:.9rem;
  font-weight:600;
}

input{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  background:var(--panel-2);
  color:var(--text);
  font:inherit;
}

input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(110,168,254,.12);
}

button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:12px;
  background:var(--accent);
  color:#07111f;
  font:inherit;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  filter:brightness(1.08);
}

.message{
  min-height:20px;
  margin:12px 0 0;
  text-align:center;
  font-size:.88rem;
}

.switch{
  margin-top:20px;
  text-align:center;
  color:var(--muted);
  font-size:.9rem;
}

.switch a{
  color:var(--accent);
  text-decoration:none;
  font-weight:700;
}

.switch a:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<main class="auth">

  <section class="card">

    <h1>Create Account</h1>

    <p class="subtitle">
      Sign up for a new account
    </p>

    <form id="signupForm">

      <div class="form-group">
        <label for="name">Name</label>

        <input
          id="name"
          type="text"
          placeholder="Your name"
          autocomplete="name"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          placeholder="Create a password"
          autocomplete="new-password"
          minlength="6"
          required
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          placeholder="Repeat your password"
          autocomplete="new-password"
          required
        >
      </div>

      <button type="submit">
        Sign Up
      </button>

      <div class="message" id="message"></div>

    </form>

    <div class="switch">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </section>

</main>

<script>
const signupForm = document.getElementById("signupForm");
const message = document.getElementById("message");

signupForm.addEventListener("submit",function(e){

  e.preventDefault();

  const name =
    document.getElementById("name").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if(!name || !email || !password || !confirmPassword){
    message.style.color = "#ff8f8f";
    message.textContent = "Please fill in all fields.";
    return;
  }

  if(password !== confirmPassword){
    message.style.color = "#ff8f8f";
    message.textContent = "Passwords do not match.";
    return;
  }

  message.style.color = "#8bd3ff";
  message.textContent = "Account form submitted.";

});
</script>

</body>
</html>
