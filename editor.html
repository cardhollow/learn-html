<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>IDE Editor</title>
<style>
:root{
    --bg:#111;
    --panel:#1b1b1b;
    --line:#333;
    --text:#f1f1f1;
}
*{
    box-sizing:border-box;
}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
    touch-action:manipulation;
}
#editor{
    position:absolute;
    left:0;
    right:0;
    top:0;
    bottom:0;
    width:100%;
    height:100%;
}
</style>
</head>
<body>

<div id="editor"></div>

<script src="ace.js"></script>
<script src="theme-monokai.js"></script>
<script src="mode-html.js"></script>
<script src="worker-html.js"></script>
<script src="ext-language_tools.js"></script>
<script src="ext-searchbox.js"></script>
<script src="ext-beautify.js"></script>
<script src="ext-statusbar.js"></script>
<script src="snippets/html.js"></script>

<script>
ace.config.set("basePath",".");
ace.config.setModuleUrl("ace/mode/html_worker","worker-html.js");
ace.config.setModuleUrl("ace/snippets/html","snippets/html.js");

const editor=ace.edit("editor");

editor.setTheme("ace/theme/monokai");
editor.session.setMode("ace/mode/html");
editor.session.setUseWrapMode(true);

editor.setOptions({
    fontSize:15,
    wrap:true,
    useWorker:true,
    enableBasicAutocompletion:false,
    enableLiveAutocompletion:false,
    enableAutoIndent:true,
    behavioursEnabled:false,
    enableSnippets:false,
    tabSize:2,
    useSoftTabs:true,
    showPrintMargin:false
});

editor.setBehavioursEnabled(false);

let IDE_CONTENT="";
const SESSION_KEY="learning_ide_content";

function loadSessionContent(){
    const saved=sessionStorage.getItem(SESSION_KEY);

    if(saved!==null){
        IDE_CONTENT=saved;
        editor.setValue(IDE_CONTENT,-1);
        return true;
    }

    return false;
}

function saveSessionContent(){
    IDE_CONTENT=editor.getValue();
    sessionStorage.setItem(SESSION_KEY,IDE_CONTENT);
}

function sendContent(){
    IDE_CONTENT=editor.getValue();
    sessionStorage.setItem(SESSION_KEY,IDE_CONTENT);

    const message={
        type:"EDITOR_CONTENT",
        content:IDE_CONTENT
    };

    if(window.parent){
        window.parent.postMessage(message,"*");
    }

    if(window.opener&&!window.opener.closed){
        window.opener.postMessage(message,"*");
    }
}

function setEditorContent(content,save=true){
    IDE_CONTENT=String(content??"");
    editor.setValue(IDE_CONTENT,-1);

    if(save){
        sessionStorage.setItem(SESSION_KEY,IDE_CONTENT);
    }
}

function getEditorContent(){
    IDE_CONTENT=editor.getValue();
    return IDE_CONTENT;
}

let suppressMessage=false;

editor.on("change",function(){
    IDE_CONTENT=editor.getValue();
    sessionStorage.setItem(SESSION_KEY,IDE_CONTENT);

    if(suppressMessage){
        return;
    }

    sendContent();
});

window.addEventListener("message",function(event){
    const data=event.data;

    if(!data||typeof data!=="object"){
        return;
    }

    if(data.type==="EDITOR_SET_CONTENT"){
        suppressMessage=true;

        setEditorContent(
            data.content??"",
            true
        );

        suppressMessage=false;
        sendContent();
        return;
    }

    if(data.type==="EDITOR_GET_CONTENT"){
        sendContent();
        return;
    }

    if(data.type==="EDITOR_REQUEST_CONTENT"){
        sendContent();
        return;
    }

    if(data.type==="EDITOR_CLEAR"){
        suppressMessage=true;

        setEditorContent(
            "",
            true
        );

        suppressMessage=false;
        sendContent();
        return;
    }
});

editor.commands.addCommand({
    name:"beautify",
    bindKey:{
        win:"Ctrl-Shift-F",
        mac:"Command-Shift-F"
    },
    exec:function(ed){
        ace.require("ace/ext/beautify").beautify(ed.session);
    }
});

editor.commands.addCommand({
    name:"saveSession",
    bindKey:{
        win:"Ctrl-S",
        mac:"Command-S"
    },
    exec:function(){
        saveSessionContent();
        sendContent();
    }
});

const restored=loadSessionContent();

if(!restored){
    setEditorContent("",true);
}

function sendReady(){
    const message={
        type:"EDITOR_READY",
        content:IDE_CONTENT
    };

    if(window.parent){
        window.parent.postMessage(message,"*");
    }

    if(window.opener&&!window.opener.closed){
        window.opener.postMessage(message,"*");
    }
}

setTimeout(sendReady,0);

window.addEventListener("beforeunload",function(){
    saveSessionContent();
});

window.IDE={
    getContent:getEditorContent,
    setContent:setEditorContent,
    save:saveSessionContent
};
</script>

</body>
</html>
