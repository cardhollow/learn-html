<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0f1115">
<title>Website Learning Project</title>

<style>
:root{
  --bg:#0f1115;
  --panel:#171a21;
  --panel2:#1d2230;
  --text:#e8eaf0;
  --muted:#a9b0c0;
  --accent:#6ea8fe;
  --success:#72d6a0;
  --danger:#ff7f8a;
  --border:rgba(255,255,255,.1);
  --radius:16px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

/* =========================
   AUTH MODAL
========================= */

.auth-overlay{
  position:fixed;
  inset:0;
  z-index:1000;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.7);
  backdrop-filter:blur(8px);
}

.auth-overlay.hidden{
  display:none;
}

.auth-card{
  width:100%;
  max-width:400px;

  padding:28px;

  background:var(--panel);

  border:1px solid var(--border);
  border-radius:var(--radius);

  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.auth-card h1{
  margin:0;
  text-align:center;
  font-size:1.8rem;
}

.auth-subtitle{
  margin:7px 0 24px;
  color:var(--muted);
  text-align:center;
  font-size:.92rem;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-size:.9rem;
  font-weight:600;
}

.form-group input{
  width:100%;
  padding:12px 13px;

  border:1px solid var(--border);
  border-radius:10px;

  outline:none;

  background:var(--panel2);
  color:var(--text);

  font:inherit;
}

.form-group input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(110,168,254,.12);
}

.auth-submit{
  width:100%;
  padding:12px;

  border:0;
  border-radius:10px;

  background:var(--accent);
  color:#07111f;

  font:inherit;
  font-weight:700;

  cursor:pointer;
}

.auth-submit:hover{
  filter:brightness(1.08);
}

.auth-message{
  min-height:20px;
  margin:12px 0 0;

  text-align:center;
  font-size:.88rem;
}

.auth-switch{
  margin-top:20px;

  color:var(--muted);
  text-align:center;
  font-size:.9rem;
}

.auth-switch button{
  border:0;
  background:none;
  color:var(--accent);

  font:inherit;
  font-weight:700;

  cursor:pointer;
}

/* =========================
   POS
========================= */

#posApp{
  display:none;
}

#posApp.show{
  display:block;
}

.pos{
  width:100%;
  max-width:1400px;
  margin:auto;
  padding:18px;

  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:18px;
}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.header{
  padding:16px;
  border-bottom:1px solid var(--border);
}

.header h1{
  margin:0;
  font-size:1.2rem;
}

.header p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:.85rem;
}

.body{
  padding:15px;
}

/* =========================
   PRODUCTS
========================= */

.products{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;
}

.product{
  min-width:0;

  padding:12px 8px;

  border:1px solid var(--border);
  border-radius:12px;

  background:var(--panel2);
  color:var(--text);

  text-align:center;

  transition:
    transform .12s ease,
    border-color .12s ease,
    background .12s ease;
}

.product:hover{
  border-color:var(--accent);
  background:#22283a;
  transform:translateY(-2px);
}

.product-name{
  font-weight:800;
  font-size:.9rem;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.product-price{
  margin:6px 0 10px;

  color:#8bd3ff;

  font-size:.85rem;
  font-weight:700;
}

.buy{
  width:100%;
  padding:7px 4px;

  border:0;
  border-radius:8px;

  background:var(--accent);
  color:#07111f;

  font-weight:800;

  cursor:pointer;
}

.buy:hover{
  filter:brightness(1.1);
}

/* =========================
   CART
========================= */

.cart{
  width:100%;
  overflow-x:auto;

  border:1px solid var(--border);
  border-radius:11px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:430px;
}

th,
td{
  padding:9px;

  border-bottom:1px solid var(--border);

  text-align:left;
  font-size:.84rem;
}

th{
  background:rgba(255,255,255,.04);
  color:var(--muted);
}

tr:last-child td{
  border-bottom:0;
}

.empty{
  padding:25px;
  text-align:center;
  color:var(--muted);
}

/* =========================
   QUANTITY
========================= */

.quantity{
  display:flex;
  align-items:center;
  gap:5px;
}

.quantity button{
  width:26px;
  height:26px;

  padding:0;

  border:1px solid var(--border);
  border-radius:6px;

  background:#22283a;
  color:var(--text);

  cursor:pointer;
}

.quantity span{
  min-width:20px;
  text-align:center;
}

/* =========================
   TOTAL
========================= */

.summary{
  margin-top:15px;
  padding-top:12px;

  border-top:1px solid var(--border);
}

.row{
  display:flex;
  justify-content:space-between;

  padding:5px 0;

  color:var(--muted);
}

.row strong{
  color:var(--text);
}

.total{
  margin-top:6px;
  padding-top:10px;

  border-top:1px solid var(--border);

  font-size:1.2rem;
}

.total strong{
  color:var(--accent);
}

/* =========================
   PAYMENT
========================= */

.payment{
  margin-top:12px;
}

.payment label{
  display:block;
  margin-bottom:5px;

  color:var(--muted);
  font-size:.8rem;
}

.payment input{
  width:100%;

  padding:10px;

  border:1px solid var(--border);
  border-radius:9px;

  outline:none;

  background:var(--panel2);
  color:var(--text);

  font:inherit;
}

.payment input:focus{
  border-color:var(--accent);
}

.change{
  display:flex;
  justify-content:space-between;

  margin-top:9px;
  padding:10px;

  border-radius:9px;

  background:rgba(114,214,160,.08);
  border:1px solid rgba(114,214,160,.15);
}

.change strong{
  color:var(--success);
}

/* =========================
   BUTTONS
========================= */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;

  margin-top:12px;
}

.action{
  padding:11px;

  border:1px solid var(--border);
  border-radius:9px;

  background:#22283a;
  color:var(--text);

  font-weight:700;

  cursor:pointer;
}

.action:hover{
  border-color:var(--accent);
}

.checkout{
  grid-column:1/-1;

  background:var(--accent);
  color:#07111f;

  border-color:transparent;
}

/* =========================
   RECEIPT
========================= */

.receipt-section{
  margin-top:15px;
}

.receipt-section label{
  display:block;
  margin-bottom:6px;

  color:var(--muted);
  font-size:.82rem;
}

#receipt{
  width:100%;
  min-height:190px;

  resize:vertical;

  padding:12px;

  border:1px solid var(--border);
  border-radius:10px;

  background:#10131a;
  color:#e8eaf0;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;

  font-size:.82rem;

  outline:none;
}

/* =========================
   REMOVE
========================= */

.remove{
  border:0;
  background:none;

  color:var(--danger);

  font-size:18px;

  cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:1000px){
  .pos{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){
  .pos{
    padding:10px;
  }

  .products{
    grid-template-columns:repeat(5,120px);
    overflow-x:auto;
    padding-bottom:5px;
  }

  .product{
    width:120px;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN / SIGN UP
========================= -->

<div class="auth-overlay" id="authOverlay">

  <section class="auth-card">

    <!-- LOGIN -->

    <div id="loginView">

      <h1>Welcome Back</h1>

      <p class="auth-subtitle">
        Login to continue
      </p>

      <form id="loginForm">

        <div class="form-group">
          <label for="loginEmail">
            Email
          </label>

          <input
            id="loginEmail"
            type="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">
            Password
          </label>

          <input
            id="loginPassword"
            type="password"
            placeholder="Enter password"
            required
          >
        </div>

        <button
          class="auth-submit"
          type="submit"
        >
          Login
        </button>

        <div
          class="auth-message"
          id="loginMessage"
        ></div>

      </form>

      <div class="auth-switch">

        Don't have an account?

        <button
          type="button"
          id="showSignup"
        >
          Sign Up
        </button>

      </div>

    </div>


    <!-- SIGN UP -->

    <div id="signupView" style="display:none">

      <h1>Create Account</h1>

      <p class="auth-subtitle">
        Create an account
      </p>

      <form id="signupForm">

        <div class="form-group">

          <label for="signupName">
            Name
          </label>

          <input
            id="signupName"
            type="text"
            placeholder="Your name"
            required
          >

        </div>


        <div class="form-group">

          <label for="signupEmail">
            Email
          </label>

          <input
            id="signupEmail"
            type="email"
            placeholder="you@example.com"
            required
          >

        </div>


        <div class="form-group">

          <label for="signupPassword">
            Password
          </label>

          <input
            id="signupPassword"
            type="password"
            placeholder="Create password"
            minlength="6"
            required
          >

        </div>


        <div class="form-group">

          <label for="signupConfirm">
            Confirm Password
          </label>

          <input
            id="signupConfirm"
            type="password"
            placeholder="Repeat password"
            required
          >

        </div>


        <button
          class="auth-submit"
          type="submit"
        >
          Sign Up
        </button>

        <div
          class="auth-message"
          id="signupMessage"
        ></div>

      </form>


      <div class="auth-switch">

        Already have an account?

        <button
          type="button"
          id="showLogin"
        >
          Login
        </button>

      </div>

    </div>

  </section>

</div>


<!-- =========================
     POS APPLICATION
========================= -->

<div id="posApp">

<main class="pos">

<!-- LEFT -->

<section class="panel">

  <header class="header">

    <h1>
      Products
    </h1>

    <p>
      Choose a product
    </p>

  </header>

  <div class="body">

    <div
      class="products"
      id="products"
    ></div>

  </div>

</section>


<!-- RIGHT -->

<section class="panel">

  <header class="header">

    <h1>
      Current Order
    </h1>

    <p>
      Your selected products
    </p>

  </header>

  <div class="body">

    <div class="cart">

      <table>

        <thead>

          <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Total</th>
            <th></th>
          </tr>

        </thead>

        <tbody id="cart">

          <tr>

            <td
              colspan="5"
              class="empty"
            >
              No items yet.
            </td>

          </tr>

        </tbody>

      </table>

    </div>


    <div class="summary">

      <div class="row">

        <span>
          Subtotal
        </span>

        <strong id="subtotal">
          ₱0.00
        </strong>

      </div>


      <div class="row">

        <span>
          Tax
        </span>

        <strong id="tax">
          ₱0.00
        </strong>

      </div>


      <div class="row total">

        <span>
          Total
        </span>

        <strong id="total">
          ₱0.00
        </strong>

      </div>


      <div class="payment">

        <label for="money">
          Money Received
        </label>

        <input
          id="money"
          type="number"
          min="0"
          placeholder="Enter amount"
        >

      </div>


      <div class="change">

        <span>
          Change
        </span>

        <strong id="change">
          ₱0.00
        </strong>

      </div>


      <div class="actions">

        <button
          class="action"
          id="clear"
          type="button"
        >
          Clear
        </button>

        <button
          class="action"
          id="print"
          type="button"
        >
          Print
        </button>

        <button
          class="action checkout"
          id="checkout"
          type="button"
        >
          Checkout
        </button>

      </div>


      <div class="receipt-section">

        <label for="receipt">
          Receipt
        </label>

        <textarea
          id="receipt"
          readonly
          placeholder="Click Print to generate the receipt..."
        ></textarea>

      </div>

    </div>

  </div>

</section>

</main>

</div>


<script>

/* =========================
   AUTH
========================= */

const authOverlay =
  document.getElementById("authOverlay");

const loginView =
  document.getElementById("loginView");

const signupView =
  document.getElementById("signupView");

const loginForm =
  document.getElementById("loginForm");

const signupForm =
  document.getElementById("signupForm");

const loginMessage =
  document.getElementById("loginMessage");

const signupMessage =
  document.getElementById("signupMessage");


document
  .getElementById("showSignup")
  .addEventListener(
    "click",
    () => {

      loginView.style.display =
        "none";

      signupView.style.display =
        "block";

    }
  );


document
  .getElementById("showLogin")
  .addEventListener(
    "click",
    () => {

      signupView.style.display =
        "none";

      loginView.style.display =
        "block";

    }
  );


signupForm.addEventListener(
  "submit",
  function(e){

    e.preventDefault();

    const name =
      document
        .getElementById("signupName")
        .value
        .trim();

    const email =
      document
        .getElementById("signupEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("signupPassword")
        .value;

    const confirm =
      document
        .getElementById("signupConfirm")
        .value;


    if(password !== confirm){

      signupMessage.style.color =
        "var(--danger)";

      signupMessage.textContent =
        "Passwords do not match.";

      return;

    }


    if(password.length < 6){

      signupMessage.style.color =
        "var(--danger)";

      signupMessage.textContent =
        "Password must be at least 6 characters.";

      return;

    }


    localStorage.setItem(
      "demoUser",
      JSON.stringify({
        name,
        email,
        password
      })
    );


    signupMessage.style.color =
      "var(--success)";

    signupMessage.textContent =
      "Account created. You can now login.";


    document
      .getElementById("loginEmail")
      .value = email;


    setTimeout(
      () => {

        signupView.style.display =
          "none";

        loginView.style.display =
          "block";

        signupMessage.textContent =
          "";

      },
      700
    );

  }
);


loginForm.addEventListener(
  "submit",
  function(e){

    e.preventDefault();

    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("loginPassword")
        .value;


    const saved =
      localStorage.getItem(
        "demoUser"
      );


    if(!saved){

      loginMessage.style.color =
        "var(--danger)";

      loginMessage.textContent =
        "No account exists. Sign up first.";

      return;

    }


    const user =
      JSON.parse(saved);


    if(
      email !== user.email ||
      password !== user.password
    ){

      loginMessage.style.color =
        "var(--danger)";

      loginMessage.textContent =
        "Invalid email or password.";

      return;

    }


    loginMessage.style.color =
      "var(--success)";

    loginMessage.textContent =
      "Login successful.";


    setTimeout(
      () => {

        authOverlay.classList.add(
          "hidden"
        );

        document
          .getElementById("posApp")
          .classList.add("show");

      },
      400
    );

  }
);


/* =========================
   PRODUCTS
========================= */

const products = [

  {name:"Burger",price:85},
  {name:"Pizza",price:120},
  {name:"Fries",price:55},
  {name:"Hotdog",price:45},
  {name:"Chicken",price:110},

  {name:"Coke",price:40},
  {name:"Sprite",price:40},
  {name:"Coffee",price:50},
  {name:"Iced Tea",price:45},
  {name:"Milk",price:35},

  {name:"Cake",price:90},
  {name:"Donut",price:35},
  {name:"Ice Cream",price:60},
  {name:"Cookie",price:30},
  {name:"Brownie",price:55},

  {name:"Sandwich",price:70},
  {name:"Pasta",price:100},
  {name:"Salad",price:75},
  {name:"Rice Meal",price:95},
  {name:"Taco",price:65},

  {name:"Nachos",price:80},
  {name:"Juice",price:45},
  {name:"Water",price:25},
  {name:"Tea",price:35},
  {name:"Muffin",price:50}

];

let cart = [];


/* =========================
   ELEMENTS
========================= */

const productsEl =
  document.getElementById("products");

const cartEl =
  document.getElementById("cart");

const subtotalEl =
  document.getElementById("subtotal");

const taxEl =
  document.getElementById("tax");

const totalEl =
  document.getElementById("total");

const moneyEl =
  document.getElementById("money");

const changeEl =
  document.getElementById("change");

const receiptEl =
  document.getElementById("receipt");


/* =========================
   MONEY
========================= */

function money(value){

  return "₱" +
    Number(value).toFixed(2);

}


/* =========================
   PRODUCTS
========================= */

function renderProducts(){

  productsEl.innerHTML = "";

  products.forEach(
    (product,index) => {

      const item =
        document.createElement("div");

      item.className =
        "product";

      item.innerHTML = `

        <div class="product-name">
          ${product.name}
        </div>

        <div class="product-price">
          ${money(product.price)}
        </div>

        <button
          class="buy"
          type="button"
        >
          BUY
        </button>

      `;


      item
        .querySelector(".buy")
        .addEventListener(
          "click",
          () => addToCart(index)
        );


      productsEl.appendChild(item);

    }
  );

}


/* =========================
   CART
========================= */

function addToCart(index){

  const product =
    products[index];


  const existing =
    cart.find(
      item =>
        item.name === product.name
    );


  if(existing){

    existing.quantity++;

  }else{

    cart.push({

      name:product.name,
      price:product.price,
      quantity:1

    });

  }


  renderCart();

}


function changeQuantity(index,amount){

  cart[index].quantity +=
    amount;


  if(cart[index].quantity <= 0){

    cart.splice(index,1);

  }


  renderCart();

}


function removeItem(index){

  cart.splice(index,1);

  renderCart();

}


/* =========================
   TOTALS
========================= */

function calculateTotals(){

  let subtotal = 0;


  cart.forEach(item => {

    subtotal +=
      item.price *
      item.quantity;

  });


  const tax =
    subtotal * .12;

  const total =
    subtotal + tax;


  return {
    subtotal,
    tax,
    total
  };

}


function updateTotals(){

  const {
    subtotal,
    tax,
    total
  } = calculateTotals();


  subtotalEl.textContent =
    money(subtotal);

  taxEl.textContent =
    money(tax);

  totalEl.textContent =
    money(total);


  updateChange();

}


function updateChange(){

  const {
    total
  } = calculateTotals();


  const received =
    Number(moneyEl.value) || 0;


  const change =
    received - total;


  if(change >= 0){

    changeEl.textContent =
      money(change);

    changeEl.style.color =
      "var(--success)";

  }else{

    changeEl.textContent =
      money(0);

    changeEl.style.color =
      "var(--danger)";

  }

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

  cartEl.innerHTML = "";


  if(!cart.length){

    cartEl.innerHTML = `

      <tr>

        <td
          colspan="5"
          class="empty"
        >
          No items yet.
        </td>

      </tr>

    `;

  }else{

    cart.forEach(
      (item,index) => {

        const row =
          document.createElement("tr");


        const itemTotal =
          item.price *
          item.quantity;


        row.innerHTML = `

          <td>
            <strong>
              ${item.name}
            </strong>
          </td>

          <td>
            ${money(item.price)}
          </td>

          <td>

            <div class="quantity">

              <button
                type="button"
                class="minus"
              >
                −
              </button>

              <span>
                ${item.quantity}
              </span>

              <button
                type="button"
                class="plus"
              >
                +
              </button>

            </div>

          </td>

          <td>
            <strong>
              ${money(itemTotal)}
            </strong>
          </td>

          <td>

            <button
              class="remove"
              type="button"
            >
              ×
            </button>

          </td>

        `;


        row
          .querySelector(".minus")
          .onclick = () =>
            changeQuantity(index,-1);


        row
          .querySelector(".plus")
          .onclick = () =>
            changeQuantity(index,1);


        row
          .querySelector(".remove")
          .onclick = () =>
            removeItem(index);


        cartEl.appendChild(row);

      }
    );

  }


  updateTotals();

}


/* =========================
   CHECKOUT
========================= */

function checkout(){

  if(!cart.length){

    alert(
      "There are no items in the order."
    );

    return;

  }


  const {
    total
  } = calculateTotals();


  const received =
    Number(moneyEl.value) || 0;


  if(received < total){

    alert(
      "The money received is not enough."
    );

    return;

  }


  alert(
    "Checkout successful!"
  );

}


/* =========================
   RECEIPT
========================= */

function createReceipt(){

  const {
    subtotal,
    tax,
    total
  } = calculateTotals();


  const received =
    Number(moneyEl.value) || 0;


  const change =
    Math.max(
      0,
      received - total
    );


  let receipt =
    "============================\n";


  receipt +=
    "          MY POS\n";

  receipt +=
    "        SALES RECEIPT\n";

  receipt +=
    "============================\n\n";


  cart.forEach(item => {

    const itemTotal =
      item.price *
      item.quantity;


    receipt +=
      item.name +
      " x" +
      item.quantity +
      "  " +
      money(itemTotal) +
      "\n";

  });


  receipt +=
    "\n----------------------------\n";


  receipt +=
    "Subtotal:  " +
    money(subtotal) +
    "\n";


  receipt +=
    "Tax:       " +
    money(tax) +
    "\n";


  receipt +=
    "TOTAL:     " +
    money(total) +
    "\n";


  receipt +=
    "Received:  " +
    money(received) +
    "\n";


  receipt +=
    "Change:    " +
    money(change) +
    "\n";


  receipt +=
    "----------------------------\n\n";


  receipt +=
    "        Thank you!\n";


  receipt +=
    "============================";


  return receipt;

}


function printReceipt(){

  if(!cart.length){

    alert(
      "There are no items to print."
    );

    return;

  }


  receiptEl.value =
    createReceipt();

}


function clearCart(){

  cart = [];

  moneyEl.value = "";

  receiptEl.value = "";

  renderCart();

}


/* =========================
   EVENTS
========================= */

moneyEl.addEventListener(
  "input",
  updateChange
);


document
  .getElementById("checkout")
  .addEventListener(
    "click",
    checkout
  );


document
  .getElementById("print")
  .addEventListener(
    "click",
    printReceipt
  );


document
  .getElementById("clear")
  .addEventListener(
    "click",
    clearCart
  );


/* =========================
   START
========================= */

renderProducts();
renderCart();

</script>

</body>
</html>
